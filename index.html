<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e8a68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한자 카드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>고려대 3급 한자 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* 원고지 한 칸 = 카드. 한 줄짜리 좁은 기둥 레이아웃, 위에 덱 목록, 아래에 학습 화면 */
:root{
  --paper:#fafcfb; --sheet:#ffffff; --ink:#1b2420; --muted:#5f6d67; --line:#d6e6de;
  --grid:#2e8a68; --grid-soft:#e7f3ed; --guide:#b9d8c9;
  --easy:#2b6cb0; --easy-soft:#e8f0fa; --mid:#a86a12; --mid-soft:#fbf2e2; --hard:#c2372b; --hard-soft:#fbeceb;
  --f-hanja:"Noto Serif KR","Songti SC","Batang",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111614; --sheet:#171e1b; --ink:#e4ebe7; --muted:#97a69f; --line:#2a3833;
  --grid:#5fc39c; --grid-soft:#1c2b25; --guide:#2f4a3f;
  --easy:#7fb0ea; --easy-soft:#18253a; --mid:#e0a64b; --mid-soft:#2d2415; --hard:#f07b6f; --hard-soft:#341b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111614; --sheet:#171e1b; --ink:#e4ebe7; --muted:#97a69f; --line:#2a3833;
  --grid:#5fc39c; --grid-soft:#1c2b25; --guide:#2f4a3f;
  --easy:#7fb0ea; --easy-soft:#18253a; --mid:#e0a64b; --mid-soft:#2d2415; --hard:#f07b6f; --hard-soft:#341b19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--grid);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--f-hanja);font-weight:700;font-size:1.55rem;letter-spacing:-.01em}
h2{font-size:.78rem;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dday{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--grid);font-weight:600;border:1.5px solid var(--grid);padding:2px 10px}
.sub{color:var(--muted);font-size:.88rem;margin:4px 0 0}
section{display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{background:var(--sheet);border:1.5px solid var(--line);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tile:hover{border-color:var(--grid)}
.tile b{font-family:var(--f-hanja);font-size:1.25rem;font-weight:700}
.tile span{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;padding:3px 11px;font-size:.82rem;border-radius:999px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--grid);border-color:var(--grid);color:var(--paper)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--sheet);border:1.5px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 14px;text-align:left}
.row:hover{border-color:var(--grid)}
.row .glyphs{font-family:var(--f-hanja);font-size:1.35rem;letter-spacing:.06em;min-width:4.6em}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .txt b{font-weight:600}
.row .txt small{color:var(--muted);font-size:.8rem}
.row .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.row.wrong{border-color:var(--hard);background:var(--hard-soft)}
.row.wrong .glyphs,.row.wrong .cnt{color:var(--hard)}
.row:disabled{opacity:.5;cursor:default}
.opts{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.link{background:none;border:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.86rem}
.removed{background:var(--sheet);border:1.5px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.removed ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.removed li button{border:1px solid var(--line);background:var(--paper);padding:3px 9px;font-size:.85rem}
.removed li button .h{font-family:var(--f-hanja);font-size:1.05rem;margin-right:4px}
.store{font-size:.78rem;color:var(--muted)}

/* 학습 화면 */
.bar{display:flex;align-items:center;gap:10px}
.bar .back{background:none;border:1px solid var(--line);padding:4px 10px;font-size:.85rem}
.bar .name{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .pos{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--grid);width:0;transition:width .2s}
.card{background:var(--sheet);border:1.5px solid var(--grid);padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;user-select:none;min-height:340px;justify-content:center;position:relative}
.card .tag{position:absolute;top:8px;left:10px;font-size:.74rem;color:var(--muted);letter-spacing:.04em}
.card .tag.hardmark{left:auto;right:10px;color:var(--hard);font-weight:600}
.cells{display:flex;gap:0;justify-content:center;flex-wrap:wrap}
.cell{width:var(--cs);display:flex;flex-direction:column;align-items:center}
.box{width:var(--cs);height:var(--cs);border:1.5px solid var(--grid);margin-left:-1.5px;display:grid;place-items:center;
  background-image:repeating-linear-gradient(90deg,var(--guide) 0 5px,transparent 5px 10px),repeating-linear-gradient(180deg,var(--guide) 0 5px,transparent 5px 10px);
  background-size:100% 1px,1px 100%;background-position:center,center;background-repeat:no-repeat}
.cell:first-child .box{margin-left:0}
.box .hj{font-family:var(--f-hanja);font-weight:500;font-size:calc(var(--cs)*.7);line-height:1}
.one{--cs:min(56vw,210px)}
.two{--cs:min(38vw,150px)}
.four{--cs:min(21vw,104px)}
.three{--cs:min(27vw,120px)}
.meaning{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:8px;min-height:3.2em;text-align:center}
.meaning .hun{font-size:.92rem;color:var(--muted)}
.meaning .eum{font-family:var(--f-hanja);font-weight:700;font-size:1.25rem;color:var(--grid)}
.one .meaning .hun{font-size:1.25rem;color:var(--ink)}
.one .meaning .eum{font-size:2rem}
.four .meaning .hun{font-size:.8rem;line-height:1.3}
.meaning .note{font-size:.72rem;color:var(--mid);max-width:16em}
.hidden-ans .meaning{visibility:hidden}
.prompt{font-size:.86rem;color:var(--muted);text-align:center}
.common{font-size:.9rem;background:var(--grid-soft);color:var(--grid);padding:3px 12px;font-weight:600}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:1.5px solid;padding:12px 4px;font-weight:600;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:1px}
.rate button kbd{font:inherit;font-size:.7rem;font-weight:400;opacity:.7}
.r-easy{border-color:var(--easy);background:var(--easy-soft);color:var(--easy)}
.r-mid{border-color:var(--mid);background:var(--mid-soft);color:var(--mid)}
.r-hard{border-color:var(--hard);background:var(--hard-soft);color:var(--hard)}
.under{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.under button{background:none;border:1px solid var(--line);padding:6px 12px;font-size:.85rem;color:var(--muted)}
.under .rm{color:var(--ink)}
.hint{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
/* 결과 */
.sum{background:var(--sheet);border:1.5px solid var(--grid);padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.sum .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum .nums div{padding:10px 4px;border:1.5px solid}
.sum .nums b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;font-family:var(--f-hanja)}
.sum .nums small{font-size:.8rem}
.sum .hardlist{font-family:var(--f-hanja);font-size:1.4rem;letter-spacing:.08em;color:var(--hard);word-break:break-all}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:8em;padding:10px;border:1.5px solid var(--line);background:var(--sheet);font-weight:600}
.actions .primary{background:var(--grid);border-color:var(--grid);color:var(--paper)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 14px;font-size:.88rem;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);z-index:20}
.toast button{background:none;border:none;color:var(--grid-soft);text-decoration:underline;padding:0;font-weight:600}
/* 유사 모양 퀴즈 */
.card.quiz{cursor:default;gap:10px;padding:30px 12px 14px;min-height:0}
.qhead{display:flex;align-items:baseline;gap:10px;justify-content:center;flex-wrap:wrap;text-align:center}
.qhead .qhun{font-size:1.35rem;font-weight:600}
.qhead .qeum{font-family:var(--f-hanja);font-weight:700;font-size:1.9rem;color:var(--grid)}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:340px}
.choice{--cs:min(23vw,92px);background:var(--sheet);border:1.5px solid var(--line);padding:12px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0}
.choice:hover:not(:disabled){border-color:var(--grid)}
.choice:disabled{cursor:default}
.choice .no{position:absolute;top:3px;left:6px;font-size:.74rem;color:var(--muted)}
.choice .box{margin-left:0}
.choice .ans{font-size:.82rem;color:var(--muted);min-height:1.3em;line-height:1.3;text-align:center}
.choice .ans b{font-family:var(--f-hanja);color:var(--ink);font-size:.95rem}
.choice.ok{border-color:var(--grid);background:var(--grid-soft)}
.choice.ok .ans b,.choice.ok .no{color:var(--grid)}
.choice.bad{border-color:var(--hard);background:var(--hard-soft)}
.choice.bad .ans b,.choice.bad .no{color:var(--hard)}
.verdict{font-weight:600;font-size:.95rem;text-align:center;margin:0}
.verdict.ok{color:var(--grid)} .verdict.bad{color:var(--hard)}
.verdict small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.rate button:disabled{opacity:.35;cursor:default}
/* Part 2 */
section.p2{border-top:1.5px solid var(--line);padding-top:18px}
.qko{font-size:2rem;font-weight:600;letter-spacing:.04em}
.qn{margin:-4px 0 0;font-size:.88rem;color:var(--muted)}
.ctx{margin:0;font-size:.9rem;line-height:1.7;color:var(--muted);background:var(--paper);border-left:3px solid var(--guide);padding:8px 10px;width:100%;word-break:keep-all}
.ctx mark{background:none;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--grid);text-underline-offset:4px;text-decoration-thickness:2px}
.wopts{display:flex;flex-direction:column;gap:8px;width:100%}
.wopt{display:grid;grid-template-columns:1.6em 1fr;align-items:center;gap:2px 8px;text-align:left;background:var(--sheet);border:1.5px solid var(--line);padding:10px 12px;min-width:0}
.wopt:hover:not(:disabled){border-color:var(--grid)}
.wopt:disabled{cursor:default}
.wopt .no{color:var(--muted);font-size:.85rem}
.wopt .wh{font-family:var(--f-hanja);font-size:1.55rem;font-weight:500;letter-spacing:.08em;line-height:1.25}
.wopt .wg{grid-column:2;font-size:.8rem;color:var(--muted);line-height:1.45}
.wopt .wg em{font-style:normal;color:var(--hard);font-weight:600}
.wopt.ok{border-color:var(--grid);background:var(--grid-soft)} .wopt.ok .wh{color:var(--grid)}
.wopt.bad{border-color:var(--hard);background:var(--hard-soft)} .wopt.bad .wh{color:var(--hard)}
.card.wq{align-items:stretch}
.card.wq .qhead,.card.wq .qn,.card.wq .prompt,.card.wq .verdict{text-align:center;justify-content:center}
.sfilter{display:flex;flex-direction:column;gap:8px}
.sfilter input{font:inherit;font-size:1rem;padding:10px 12px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);width:100%}
.sfilter input:focus{outline:2px solid var(--grid);outline-offset:1px}
#slist{display:flex;flex-direction:column;gap:18px}
.snd{gap:8px}
.snd-h{display:flex;align-items:baseline;gap:8px;border-bottom:1.5px solid var(--grid);padding-bottom:4px}
.snd-h b{font-size:1.5rem;color:var(--grid)}
.snd-h span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:.72rem!important;color:var(--mid)!important;border:1px solid var(--mid);padding:0 6px;border-radius:999px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--sheet);border:1.5px solid var(--line);padding:8px 10px;text-align:left;min-width:0;cursor:default}
.sc.cover{cursor:pointer}
.sch{font-family:var(--f-hanja);font-size:1.9rem;line-height:1.15}
.sm{font-size:.88rem;font-weight:600}
.sc.cover:not(.rev) .sm{color:transparent;background:var(--line);border-radius:3px}
.sx{display:flex;flex-direction:column;font-size:.78rem;color:var(--muted);line-height:1.4}
.sx b{font-family:var(--f-hanja);font-weight:500;color:var(--ink)}
.ptext{background:var(--sheet);border:1.5px solid var(--line);padding:16px 14px;font-size:1.02rem;line-height:2.5;word-break:keep-all}
.ptext ruby{font-family:var(--f-hanja)}
.ptext rt{font-family:var(--f-ui);font-size:.58em;color:var(--muted)}
.ptext ruby.done{color:var(--grid)}
.ptext ruby.miss{color:var(--hard);text-decoration:underline;text-decoration-color:var(--hard);text-underline-offset:5px}
.u{scroll-margin-top:90px;font:inherit;background:var(--grid-soft);border:none;border-bottom:2px solid var(--grid);padding:0 3px;margin:0 1px;color:var(--ink);line-height:1.6}
.u:hover{background:var(--guide)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--sheet);border-top:2px solid var(--grid);box-shadow:0 -6px 24px rgba(0,0,0,.12);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet>*{max-width:560px;width:100%;margin-inline:auto}
.sh-head{display:flex;justify-content:space-between;align-items:center}
.sh-x{background:none;border:1px solid var(--line);padding:4px 10px;font-size:.85rem;color:var(--muted)}
.sheet .prompt,.sheet .verdict{text-align:center}
@media (max-width:420px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo" type="button">되돌리기</button></div>

(async()=>{
  try{

    const id=await user.id(); if(!id) return;

      S={removed:remote.removed.filter(x=>byId[x]),wrong:(remote.wrong||[]).filter(x=>byId[x]),at:remote.at||0};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const srcLabel=r=>r==='PDF'?'PDF':r+'회';
function deckCards(deck){
  const rm=removed();
  if(deck.kind==='round') return CARDS.filter(c=>c.t==='s'&&c.r===deck.r&&!rm.has(c.id));
  if(deck.kind==='wrong') return S.wrong.map(id=>byId[id]).filter(c=>c&&!rm.has(c.id)&&((c.t==='w')===(deck.p===2)));
  if(deck.kind==='w') return WCARDS.filter(c=>!rm.has(c.id)&&(deck.r==='all'||c.src.some(s=>deck.r==='PDF'?s==='PDF':s.startsWith(deck.r+'회'))));
  return CARDS.filter(c=>c.t===deck.kind&&(deck.r==='all'||c.r===deck.r)&&!rm.has(c.id));
}
function deckName(deck){
  if(deck.kind==='round') return deck.r+'회 단자';
  if(deck.kind==='wrong') return deck.p===2?'한자어 오답':'한자 오답';
  if(deck.kind==='w') return '한자어 표기'+(deck.r==='all'?'':' · '+srcLabel(deck.r));
  const base=deck.kind==='m'?'유사 모양 한자':'같은 독음 한자';
  return deck.r==='all'?base:base+' · '+deck.r+'회';
}
function dday(){
  const now=new Date(), exam=new Date(2026,10,22);
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const d=Math.round((exam-t)/864e5);
  return d>0?'시험 D-'+d:d===0?'오늘 시험':'';
}

function dueum(s){
  const code=s.charCodeAt(0)-0xAC00; const out=[s]; if(code<0||code>11171) return out;
  const ini=Math.floor(code/588), med=Math.floor((code%588)/28), fin=code%28;
  const mk=i=>String.fromCharCode(0xAC00+i*588+med*28+fin); const yi=[2,6,7,12,17,20].includes(med);
  if(ini===5) out.push(yi?mk(11):mk(2)); if(ini===2&&yi) out.push(mk(11));
  return out;
}
function gloss(ch,syl){
  const m=P2.C[ch]; if(!m) return ch;
  const e=m.slice(m.lastIndexOf(' ')+1);
  return syl&&!dueum(e).includes(syl)&&!dueum(syl).includes(e)?`${m}(여기선 ${syl})`:m;
}
function glossWord(w,ko,diffFrom){

}

}

  <p class="store">PDF Part 2 지문입니다. 밑줄 친 한글 단어를 누르면 시험처럼 네 가지 표기 중에서 고릅니다. 틀린 단어는 오답에 담깁니다.</p>
  <div class="rows">${P2.P.map((p,pi)=>{const tot=pUnits(pi).length, st=pState(pi), d=st.ok.length+st.bad.length;
    return `<button class="row" data-p="${pi}"><span class="txt"><b>${esc(p.t)}</b><small>${d?`${d}/${tot} 풀이 · 틀림 ${st.bad.length}`:`빈칸 ${tot}개`}</small></span><span class="cnt">${d>=tot?'완료':Math.round(d/tot*100)+'%'}</span></button>`}).join('')}</div>`;
  $('#back').onclick=()=>go('home');
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ui.pi=+b.dataset.p;ui.pshow=false;go('passage');});
}
let sheet=null;
function unitInfo(u){
  if(u.length===1){const w=P2.W[u[0]];return {h:w.h,k:w.k,card:WCARDS[u[0]]};}
  return {h:u[0],k:u[1],card:null};
}
function singleOptions(ch,rd){
  const g=P2.G.find(x=>x.s===rd); let pool=g?g.c.map(x=>x[0]):[];
  if(pool.length<4) pool=pool.concat(Object.keys(P2.C).filter(c=>{const m=P2.C[c];return m.slice(m.lastIndexOf(' ')+1)===rd}));
  pool=[...new Set(pool)].filter(c=>c!==ch);
  return wordOptions(ch,[],pool);
}
function renderPassage(){
  const pi=ui.pi, p=P2.P[pi], st=pState(pi), ok=new Set(st.ok), bad=new Set(st.bad);
  const tot=pUnits(pi).length, d=ok.size+bad.size;
  const body=p.u.map((u,n)=>{
    if(typeof u==='string') return esc(u);
    const {h,k}=unitInfo(u), key=ukey(u);
    if(ok.has(key)||bad.has(key)||ui.pshow) return `<ruby class="u done ${bad.has(key)?'miss':''}" lang="zh-Hant">${esc(h)}<rt>${esc(k)}</rt></ruby>`;
    return `<button class="u" data-u="${n}">${esc(k)}</button>`;
  }).join('');
  $('#app').innerHTML=`
  <div class="bar"><button class="back" id="back">← 지문</button><span class="name">${esc(p.t)}</span><span class="pos">${d} / ${tot}</span></div>
  <div class="prog"><i style="width:${(d/tot*100).toFixed(1)}%"></i></div>
  <div class="chips"><button class="chip" id="pshow" aria-pressed="${ui.pshow}">모두 한자로 보기</button><button class="chip" id="preset">처음부터 다시</button></div>
  <article class="ptext">${body}</article>
  <p class="store">빨간 밑줄은 틀렸던 단어입니다. 한 번 풀면 같은 단어는 지문 전체에서 함께 채워집니다.</p>
  ${sheet?'<div style="height:64vh" aria-hidden="true"></div>':''}
  <div class="sheet" id="sheet" hidden></div>`;
  $('#back').onclick=()=>{sheet=null;go('plist');};
  $('#pshow').onclick=()=>{ui.pshow=!ui.pshow;renderPassage();};
  $('#preset').onclick=()=>{PS[pi]={ok:[],bad:[]};savePS();sheet=null;renderPassage();};
  document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>openSheet(+b.dataset.u));
  if(sheet) drawSheet();
}
function openSheet(n){
  const u=P2.P[ui.pi].u[n], info=unitInfo(u);
  const qz=info.card?wordOptions(info.h,info.card.x,info.card.g):singleOptions(info.h,info.k);
  sheet={n,u,info,qz}; drawSheet();
}
function drawSheet(){
  const el=$('#sheet'); if(!el||!sheet) return;
  const {info,qz}=sheet, done=qz.picked!==null, right=done&&qz.picked===qz.target;
  el.hidden=false;
  el.innerHTML=`<div class="sh-head"><span class="qko">${esc(info.k)}</span><button class="sh-x" id="shx" aria-label="닫기">닫기</button></div>
    <p class="prompt">${info.card?'문맥에 맞는 한자어를 고르세요':`'${esc(info.k)}'에 맞는 글자를 고르세요`}</p>
    <div class="wopts">${optsHTML(qz,info.k,done,'data-sp')}</div>
    ${done?`<p class="verdict ${right?'ok':'bad'}">${right?'정답입니다':'틀렸습니다 · 정답 '+esc(info.h)}${!right&&info.card?'<small>이 단어를 오답에 담았습니다</small>':''}</p>
      <div class="actions"><button class="primary" id="shn">다음 빈칸</button><button id="shc">닫기</button></div>`:''}`;
  $('#shx').onclick=closeSheet;
  document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>answerSheet(+b.dataset.sp));
  if(done){ $('#shn').onclick=nextBlank; $('#shc').onclick=closeSheet; $('#shn').focus(); }
}
function answerSheet(idx){
  const s=sheet; if(!s||s.qz.picked!==null) return;
  s.qz.picked=idx; const right=idx===s.qz.target, st=pState(ui.pi), key=ukey(s.u);
  if(!st.ok.includes(key)&&!st.bad.includes(key)) (right?st.ok:st.bad).push(key);
  savePS();
  if(!right&&s.info.card&&!S.wrong.includes(s.info.card.id)&&!S.removed.includes(s.info.card.id)){S.wrong.push(s.info.card.id);save();}
  renderPassage();
}
function closeSheet(){ sheet=null; renderPassage(); }
function nextBlank(){
  const from=sheet?sheet.n:-1; sheet=null; renderPassage();
  const btns=[...document.querySelectorAll('[data-u]')]; const nb=btns.find(b=>+b.dataset.u>from)||btns[0];
  if(nb){ openSheet(+nb.dataset.u); const nb2=document.querySelector(`[data-u="${nb.dataset.u}"]`); nb2&&nb2.scrollIntoView({block:'start'}); }
}

/* ---------- 토스트 ---------- */
let toastTimer=null;
function showToast(msg,undo){ $('#toastMsg').textContent=msg; const t=$('#toast'); t.hidden=false;
  $('#toastUndo').onclick=()=>{hideToast();undo();}; clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,5000);}
function hideToast(){ $('#toast').hidden=true; clearTimeout(toastTimer); }

document.addEventListener('keydown',e=>{
  if(ui.view!=='study'||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.target.tagName==='INPUT') return;
  const cur=ses&&ses.q[ses.i];
  if(cur&&(cur.t==='m'||cur.t==='w')&&ses.qz&&ses.qz.picked===null){
    const n='1234'.indexOf(e.key); if(n>=0){ e.preventDefault(); pick(ses.qz.order[n]); }
    return;
  }
  if(e.key===' '||e.key==='Enter'){ if(cur&&(cur.t==='m'||cur.t==='w')) return; if(e.target.tagName==='BUTTON'&&e.target.id!=='card') return; e.preventDefault(); flip(); }
  else if(e.key==='1') rate('easy'); else if(e.key==='2') rate('mid'); else if(e.key==='3') rate('hard');
  else if(e.key==='x'||e.key==='X') removeCurrent();
});
render();
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
</script>
