<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e8a68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한자 카드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>고려대 3급 한자 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* 원고지 한 칸 = 카드. 한 줄짜리 좁은 기둥 레이아웃, 위에 덱 목록, 아래에 학습 화면 */
:root{
  --paper:#fafcfb; --sheet:#ffffff; --ink:#1b2420; --muted:#5f6d67; --line:#d6e6de;
  --grid:#2e8a68; --grid-soft:#e7f3ed; --guide:#b9d8c9;
  --easy:#2b6cb0; --easy-soft:#e8f0fa; --mid:#a86a12; --mid-soft:#fbf2e2; --hard:#c2372b; --hard-soft:#fbeceb;
  --f-hanja:"Noto Serif KR","Songti SC","Batang",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111614; --sheet:#171e1b; --ink:#e4ebe7; --muted:#97a69f; --line:#2a3833;
  --grid:#5fc39c; --grid-soft:#1c2b25; --guide:#2f4a3f;
  --easy:#7fb0ea; --easy-soft:#18253a; --mid:#e0a64b; --mid-soft:#2d2415; --hard:#f07b6f; --hard-soft:#341b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111614; --sheet:#171e1b; --ink:#e4ebe7; --muted:#97a69f; --line:#2a3833;
  --grid:#5fc39c; --grid-soft:#1c2b25; --guide:#2f4a3f;
  --easy:#7fb0ea; --easy-soft:#18253a; --mid:#e0a64b; --mid-soft:#2d2415; --hard:#f07b6f; --hard-soft:#341b19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--grid);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--f-hanja);font-weight:700;font-size:1.55rem;letter-spacing:-.01em}
h2{font-size:.78rem;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dday{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--grid);font-weight:600;border:1.5px solid var(--grid);padding:2px 10px}
.sub{color:var(--muted);font-size:.88rem;margin:4px 0 0}
section{display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{background:var(--sheet);border:1.5px solid var(--line);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tile:hover{border-color:var(--grid)}
.tile b{font-family:var(--f-hanja);font-size:1.25rem;font-weight:700}
.tile span{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;padding:3px 11px;font-size:.82rem;border-radius:999px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--grid);border-color:var(--grid);color:var(--paper)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--sheet);border:1.5px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 14px;text-align:left}
.row:hover{border-color:var(--grid)}
.row .glyphs{font-family:var(--f-hanja);font-size:1.35rem;letter-spacing:.06em;min-width:4.6em}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .txt b{font-weight:600}
.row .txt small{color:var(--muted);font-size:.8rem}
.row .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.row.wrong{border-color:var(--hard);background:var(--hard-soft)}
.row.wrong .glyphs,.row.wrong .cnt{color:var(--hard)}
.row:disabled{opacity:.5;cursor:default}
.opts{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.link{background:none;border:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.86rem}
.removed{background:var(--sheet);border:1.5px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.removed ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.removed li button{border:1px solid var(--line);background:var(--paper);padding:3px 9px;font-size:.85rem}
.removed li button .h{font-family:var(--f-hanja);font-size:1.05rem;margin-right:4px}
.store{font-size:.78rem;color:var(--muted)}

/* 학습 화면 */
.bar{display:flex;align-items:center;gap:10px}
.bar .back{background:none;border:1px solid var(--line);padding:4px 10px;font-size:.85rem}
.bar .name{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .pos{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--grid);width:0;transition:width .2s}
.card{background:var(--sheet);border:1.5px solid var(--grid);padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;user-select:none;min-height:340px;justify-content:center;position:relative}
.card .tag{position:absolute;top:8px;left:10px;font-size:.74rem;color:var(--muted);letter-spacing:.04em}
.card .tag.hardmark{left:auto;right:10px;color:var(--hard);font-weight:600}
.cells{display:flex;gap:0;justify-content:center;flex-wrap:wrap}
.cell{width:var(--cs);display:flex;flex-direction:column;align-items:center}
.box{width:var(--cs);height:var(--cs);border:1.5px solid var(--grid);margin-left:-1.5px;display:grid;place-items:center;
  background-image:repeating-linear-gradient(90deg,var(--guide) 0 5px,transparent 5px 10px),repeating-linear-gradient(180deg,var(--guide) 0 5px,transparent 5px 10px);
  background-size:100% 1px,1px 100%;background-position:center,center;background-repeat:no-repeat}
.cell:first-child .box{margin-left:0}
.box .hj{font-family:var(--f-hanja);font-weight:500;font-size:calc(var(--cs)*.7);line-height:1}
.one{--cs:min(56vw,210px)}
.two{--cs:min(38vw,150px)}
.four{--cs:min(21vw,104px)}
.three{--cs:min(27vw,120px)}
.meaning{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:8px;min-height:3.2em;text-align:center}
.meaning .hun{font-size:.92rem;color:var(--muted)}
.meaning .eum{font-family:var(--f-hanja);font-weight:700;font-size:1.25rem;color:var(--grid)}
.one .meaning .hun{font-size:1.25rem;color:var(--ink)}
.one .meaning .eum{font-size:2rem}
.four .meaning .hun{font-size:.8rem;line-height:1.3}
.meaning .note{font-size:.72rem;color:var(--mid);max-width:16em}
.hidden-ans .meaning{visibility:hidden}
.prompt{font-size:.86rem;color:var(--muted);text-align:center}
.common{font-size:.9rem;background:var(--grid-soft);color:var(--grid);padding:3px 12px;font-weight:600}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:1.5px solid;padding:12px 4px;font-weight:600;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:1px}
.rate button kbd{font:inherit;font-size:.7rem;font-weight:400;opacity:.7}
.r-easy{border-color:var(--easy);background:var(--easy-soft);color:var(--easy)}
.r-mid{border-color:var(--mid);background:var(--mid-soft);color:var(--mid)}
.r-hard{border-color:var(--hard);background:var(--hard-soft);color:var(--hard)}
.under{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.under button{background:none;border:1px solid var(--line);padding:6px 12px;font-size:.85rem;color:var(--muted)}
.under .rm{color:var(--ink)}
.hint{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
/* 결과 */
.sum{background:var(--sheet);border:1.5px solid var(--grid);padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.sum .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum .nums div{padding:10px 4px;border:1.5px solid}
.sum .nums b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;font-family:var(--f-hanja)}
.sum .nums small{font-size:.8rem}
.sum .hardlist{font-family:var(--f-hanja);font-size:1.4rem;letter-spacing:.08em;color:var(--hard);word-break:break-all}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:8em;padding:10px;border:1.5px solid var(--line);background:var(--sheet);font-weight:600}
.actions .primary{background:var(--grid);border-color:var(--grid);color:var(--paper)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 14px;font-size:.88rem;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);z-index:20}
.toast button{background:none;border:none;color:var(--grid-soft);text-decoration:underline;padding:0;font-weight:600}
@media (max-width:420px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

</head>

const ROUNDS=[50,40,30,20,10];
const byId=Object.fromEntries(CARDS.map(c=>[c.id,c]));
const KEY='hanja3-cards-v1';
let S={removed:[],wrong:[],at:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&Array.isArray(s.removed)) S=s;}catch(e){}
let storeMode='local', dbDoc=null, writing=Promise.resolve(), saveTimer=null;
let ui={view:'home',shuffle:true,filter:{m:'all',y:'all'},showRemoved:false};
try{ui.shuffle=localStorage.getItem(KEY+'-shuffle')!=='0'}catch(e){}

const removed=()=>new Set(S.removed), wrong=()=>new Set(S.wrong);
function save(){
  S.at=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ if(!dbDoc) return; const snap={removed:[...S.removed],wrong:[...S.wrong],at:S.at};
    writing=writing.then(()=>dbDoc.set(snap)).catch(()=>{}); },600);
}
(async()=>{
  try{
    const [db,user]=await Promise.all([window.claude?.use?.('db'),window.claude?.use?.('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbDoc=db.doc('data/users/'+id+'/state');
    const snap=await dbDoc.get();
    const remote=snap.exists?snap.data():null;
    if(remote&&Array.isArray(remote.removed)&&(remote.at||0)>=(S.at||0)){
      S={removed:remote.removed.filter(x=>byId[x]),wrong:(remote.wrong||[]).filter(x=>byId[x]),at:remote.at||0};
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    }else if(S.at){ await dbDoc.set({removed:S.removed,wrong:S.wrong,at:S.at}); }
    storeMode='db'; if(ui.view==='home') render();
  }catch(e){}
})();

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const glyphOf=c=>c.t==='s'?c.c:c.items.map(x=>x.c).join('');
function deckCards(deck){
  const rm=removed();
  if(deck.kind==='round') return CARDS.filter(c=>c.t==='s'&&c.r===deck.r&&!rm.has(c.id));
  if(deck.kind==='wrong') return S.wrong.map(id=>byId[id]).filter(c=>c&&!rm.has(c.id));
  return CARDS.filter(c=>c.t===deck.kind&&(deck.r==='all'||c.r===deck.r)&&!rm.has(c.id));
}
function deckName(deck){
  if(deck.kind==='round') return deck.r+'회 단자';
  if(deck.kind==='wrong') return '오답';
  const base=deck.kind==='m'?'유사 모양 한자':'같은 독음 한자';
  return deck.r==='all'?base:base+' · '+deck.r+'회';
}
function dday(){
  const now=new Date(), exam=new Date(2026,10,22);
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const d=Math.round((exam-t)/864e5);
  return d>0?'시험 D-'+d:d===0?'오늘 시험':'';
}

function render(){ if(ui.view==='home') renderHome(); else if(ui.view==='study') renderStudy(); else renderSummary(); }
function renderHome(){
  const rm=removed();

    return `<button class="tile" data-round="${r}"><b>${r}회</b><span>${n}${n<tot?' / '+tot:''}장</span></button>`}).join('');
  const chipRow=k=>`<div class="chips" role="group" aria-label="회차 고르기">${['all',...ROUNDS].map(r=>`<button class="chip" data-chip="${k}" data-r="${r}" aria-pressed="${ui.filter[k]===String(r)||ui.filter[k]===r}">${r==='all'?'전체':r+'회'}</button>`).join('')}</div>`;
  const fm=ui.filter.m==='all'?'all':+ui.filter.m, fy=ui.filter.y==='all'?'all':+ui.filter.y;
  const nm=deckCards({kind:'m',r:fm}).length, ny=deckCards({kind:'y',r:fy}).length;
  const wl=deckCards({kind:'wrong'});
  const remList=S.removed.map(id=>byId[id]).filter(Boolean);
  $('#app').innerHTML=`
  <header class="top"><div><h1>고려대 3급 한자 카드</h1><p class="sub">기출 50·40·30·20·10회 Part 1 · 카드를 누르면 뒤집힙니다</p></div>${dday()?`<span class="dday">${dday()}</span>`:''}</header>
  <section><h2>오답</h2><div class="rows">
    <button class="row wrong" id="goWrong" ${wl.length?'':'disabled'}><span class="glyphs">${esc(wl.slice(0,4).map(glyphOf).join(' ').slice(0,6))||'—'}</span><span class="txt"><b>오답 복습</b><small>${wl.length?'"쉬움"을 누르면 오답에서 빠집니다':'"어려움"으로 고른 카드가 세션이 끝나면 여기 모입니다'}</small></span><span class="cnt">${wl.length}장</span></button>
  </div></section>
  <section><h2>회차별 단자</h2><div class="tiles">${tiles}</div></section>
  <section><h2>유사 모양 한자 · 문항 11~20</h2>${chipRow('m')}<div class="rows">
    <button class="row" id="goM" ${nm?'':'disabled'}><span class="glyphs">甲由用申</span><span class="txt"><b>유사 모양 한자</b><small>한 카드에 같은 문항의 네 글자</small></span><span class="cnt">${nm}세트</span></button></div></section>
  <section><h2>같은 독음 한자 · 문항 21~30</h2>${chipRow('y')}<div class="rows">
    <button class="row" id="goY" ${ny?'':'disabled'}><span class="glyphs">卷勸</span><span class="txt"><b>같은 독음 한자</b><small>한 카드에 음이 같은 두 글자</small></span><span class="cnt">${ny}쌍</span></button></div></section>
  <div class="opts"><label><input type="checkbox" id="shuffle" ${ui.shuffle?'checked':''}> 순서 섞기</label>
    <button class="link" id="toggleRemoved">제거한 카드 ${remList.length}장 ${ui.showRemoved?'닫기':'보기'}</button></div>
  ${ui.showRemoved?`<div class="removed">${remList.length?`<ul>${remList.map(c=>`<li><button data-restore="${c.id}" title="다시 넣기"><span class="h">${esc(glyphOf(c))}</span>${c.r}회 · 되살리기</button></li>`).join('')}</ul>`:'<span class="store">제거한 카드가 없습니다.</span>'}</div>`:''}
  <p class="store">${storeMode==='db'?'진도(오답·제거한 카드)는 계정에 저장되어 다른 기기에서도 이어집니다.':'진도(오답·제거한 카드)는 이 휴대폰에 저장됩니다.'} 단축키: Space 뒤집기 · 1 쉬움 · 2 애매 · 3 어려움 · X 제거</p>`;
  document.querySelectorAll('[data-round]').forEach(b=>b.onclick=()=>start({kind:'round',r:+b.dataset.round}));
  document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{ui.filter[b.dataset.chip]=b.dataset.r;renderHome();});
  $('#goM').onclick=()=>start({kind:'m',r:fm}); $('#goY').onclick=()=>start({kind:'y',r:fy});
  $('#goWrong').onclick=()=>start({kind:'wrong'});
  $('#shuffle').onchange=e=>{ui.shuffle=e.target.checked;try{localStorage.setItem(KEY+'-shuffle',ui.shuffle?'1':'0')}catch(_){}};
  $('#toggleRemoved').onclick=()=>{ui.showRemoved=!ui.showRemoved;renderHome();};
  document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{S.removed=S.removed.filter(x=>x!==b.dataset.restore);save();renderHome();});
}

/* ---------- 세션 ---------- */
let ses=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(deck){
  let q=deckCards(deck).slice(); if(!q.length) return;
  if(ui.shuffle) shuffle(q);
  ses={deck,q,i:0,flipped:false,counts:{easy:0,mid:0,hard:0},hard:new Set(),clearedWrong:[],total:q.length};
  ui.view='study'; hideToast(); render(); window.scrollTo(0,0);
}
function cellsHTML(c,flipped){
  const items=c.t==='s'?[c]:c.items;
  const cls=items.length===1?'one':items.length===2?'two':items.length===3?'three':'four';
  return `<div class="cells ${cls} ${flipped?'':'hidden-ans'}">${items.map(x=>`<div class="cell"><div class="box"><span class="hj" lang="zh-Hant">${esc(x.c)}</span></div>
    <div class="meaning"><span class="hun">${esc(x.h)}</span><span class="eum">${esc(x.e)}</span>${x.note&&flipped?`<span class="note">${esc(x.note)}</span>`:''}</div></div>`).join('')}</div>`;
}
function renderStudy(){
  const c=ses.q[ses.i]; const wl=wrong();
  const tag=c.t==='s'?`${c.r}회 ${c.n}번`:`${c.r}회 ${c.t==='m'?'유사 모양':'같은 독음'} ${c.k}`;
  const prompt=c.t==='s'?'훈과 음을 떠올린 뒤 카드를 누르세요':c.t==='m'?'네 글자의 훈과 음을 구별해 보세요':'두 글자의 공통 독음과 각각의 뜻은?';
  const common=c.t==='y'&&ses.flipped?`<span class="common">공통 독음 · ${esc(c.items[0].e)}</span>`:'';
  $('#app').innerHTML=`
  <div class="bar"><button class="back" id="back">← 목록</button><span class="name">${esc(deckName(ses.deck))}</span><span class="pos">${ses.i+1} / ${ses.q.length}</span></div>
  <div class="prog"><i style="width:${(ses.i/ses.q.length*100).toFixed(1)}%"></i></div>
  <div class="card" id="card" tabindex="0" role="button" aria-label="카드 뒤집기">
    <span class="tag">${tag}</span>${ses.deck.kind!=='wrong'&&wl.has(c.id)?'<span class="tag hardmark">오답</span>':''}
    ${cellsHTML(c,ses.flipped)}
    ${ses.flipped?common:`<span class="prompt">${prompt}</span>`}
  </div>
  <div class="rate">
    <button class="r-easy" data-rate="easy">쉬움<kbd>1</kbd></button>
    <button class="r-mid" data-rate="mid">애매<kbd>2</kbd></button>
    <button class="r-hard" data-rate="hard">어려움<kbd>3</kbd></button>
  </div>
  <p class="hint">${ses.deck.kind==='wrong'?'쉬움 → 오답에서 빠짐 · 애매 → 이번 세션 끝에 한 번 더 · 어려움 → 오답에 남김':'애매 → 이번 세션 끝에 한 번 더 · 어려움 → 세션이 끝나면 오답에 추가'}</p>
  <div class="under"><button class="rm" id="rm">이미 아는 한자 · 카드 제거</button><button id="end">세션 끝내기</button></div>`;
  $('#card').onclick=flip; $('#back').onclick=()=>{finish(true)};
  document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));
  $('#rm').onclick=removeCurrent; $('#end').onclick=()=>finish(false);
}
function flip(){ses.flipped=!ses.flipped;renderStudy();}
function rate(r){
  const c=ses.q[ses.i]; ses.counts[r]++;
  if(ses.deck.kind==='wrong'){
    if(r==='easy'&&S.wrong.includes(c.id)){S.wrong=S.wrong.filter(x=>x!==c.id);ses.clearedWrong.push(c.id);save();}
  }else if(r==='hard') ses.hard.add(c.id);
  if(r==='mid') ses.q.push(c);
  next();
}
function next(){ses.i++;ses.flipped=false; if(ses.i>=ses.q.length) finish(false); else renderStudy();}
function removeCurrent(){
  const c=ses.q[ses.i]; const wasWrong=S.wrong.includes(c.id); const snapQ=ses.q.slice(); const snapI=ses.i; const hadHard=ses.hard.has(c.id);
  if(!S.removed.includes(c.id)) S.removed.push(c.id);
  S.wrong=S.wrong.filter(x=>x!==c.id); ses.hard.delete(c.id); save();
  ses.q=ses.q.filter((x,k)=>k<ses.i||x.id!==c.id); ses.flipped=false;
  showToast(`${glyphOf(c)} 카드를 제거했습니다`,()=>{
    S.removed=S.removed.filter(x=>x!==c.id); if(wasWrong&&!S.wrong.includes(c.id)) S.wrong.push(c.id); if(hadHard) ses.hard.add(c.id); save();
    if(ui.view==='study'){ses.q=snapQ;ses.i=snapI;ses.flipped=false;renderStudy();} else if(ui.view==='home') renderHome();
  });
  if(ses.i>=ses.q.length) finish(false); else renderStudy();
}
function finish(toHome){
  if(!ses) return;
  const added=[...ses.hard].filter(id=>!S.wrong.includes(id));
  if(added.length){S.wrong.push(...added);save();}
  ses.added=added;
  if(toHome){ses=null;ui.view='home';render();return;}
  ui.view='summary'; render(); window.scrollTo(0,0);
}
function renderSummary(){
  const s=ses; const isW=s.deck.kind==='wrong';
  const hardIds=isW?[]:[...s.hard];
  $('#app').innerHTML=`
  <div class="bar"><span class="name">${esc(deckName(s.deck))} · 세션 끝</span></div>
  <div class="sum">
    <div class="nums">
      <div class="r-easy"><b>${s.counts.easy}</b><small>쉬움</small></div>
      <div class="r-mid"><b>${s.counts.mid}</b><small>애매</small></div>
      <div class="r-hard"><b>${s.counts.hard}</b><small>어려움</small></div>
    </div>
    ${isW?`<p style="margin:0">오답에서 ${s.clearedWrong.length}장을 뺐습니다. 남은 오답은 ${deckCards({kind:'wrong'}).length}장입니다.</p>`
      :hardIds.length?`<p style="margin:0">어려움으로 고른 ${hardIds.length}장을 오답에 담았습니다${s.added.length<hardIds.length?' (이미 있던 카드 포함)':''}.</p><div class="hardlist" lang="zh-Hant">${esc(hardIds.map(id=>glyphOf(byId[id])).join(' '))}</div>`
      :'<p style="margin:0">어려움으로 고른 카드가 없습니다.</p>'}
  </div>
  <div class="actions">
    ${deckCards({kind:'wrong'}).length?'<button class="primary" id="sw">오답 복습</button>':''}
    <button id="again">이 덱 다시</button><button id="home">목록으로</button>
  </div>`;
  $('#sw')&&($('#sw').onclick=()=>start({kind:'wrong'}));
  $('#again').onclick=()=>{ if(deckCards(s.deck).length) start(s.deck); else {ui.view='home';render();} };
  $('#home').onclick=()=>{ses=null;ui.view='home';render();};
}

/* ---------- 토스트 ---------- */
let toastTimer=null;
function showToast(msg,undo){ $('#toastMsg').textContent=msg; const t=$('#toast'); t.hidden=false;
  $('#toastUndo').onclick=()=>{hideToast();undo();}; clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,5000);}
function hideToast(){ $('#toast').hidden=true; clearTimeout(toastTimer); }

document.addEventListener('keydown',e=>{
  if(ui.view!=='study'||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.target.tagName==='INPUT') return;
  if(e.key===' '||e.key==='Enter'){ if(e.target.tagName==='BUTTON'&&e.target.id!=='card') return; e.preventDefault(); flip(); }
  else if(e.key==='1') rate('easy'); else if(e.key==='2') rate('mid'); else if(e.key==='3') rate('hard');
  else if(e.key==='x'||e.key==='X') removeCurrent();
});
render();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
</script>
